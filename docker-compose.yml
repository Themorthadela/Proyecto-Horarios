version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - ./Proyecto:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: institutobd
      MYSQL_USER: Admin
      MYSQL_PASSWORD: 126658
    ports:
      - "3307:3306"
    volumes:  #al agregarle volumen a la base quiero decir que le estoy dando un espacio donde persistir los cambios de la misma
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root